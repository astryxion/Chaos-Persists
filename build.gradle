plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.astryxion.chaospersists'
version = '1.21.1-0.9.2'
base { archivesName = 'chaospersists-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge:19.70.0.469'
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
}
neoForge {
    version = '21.1.264'
    runs {
        client { client() }
        server { server(); programArgument 'nogui' }
    }
    mods { chaospersists { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
